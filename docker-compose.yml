version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rateshopper-db
    environment:
      POSTGRES_USER: rateshopper
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rateshopper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateshopper"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rateshopper-backend
    environment:
      DATABASE_URL: postgresql://rateshopper:password@postgres:5432/rateshopper
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:8080
      SCRAPER_CONCURRENCY: 3
      SCRAPER_TIMEOUT_MS: 30000
      SCRAPER_DELAY_MIN_MS: 2000
      SCRAPER_DELAY_MAX_MS: 5000
      REFRESH_SCHEDULE_1: "0 6 * * *"
      REFRESH_SCHEDULE_2: "0 14 * * *"
      REFRESH_SCHEDULE_3: "0 22 * * *"
      PARITY_THRESHOLD_PCT: 2
      LOOK_AHEAD_DAYS: "1,3,7,14,30,60,90"
      BASE_CURRENCY: THB
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rateshopper-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
